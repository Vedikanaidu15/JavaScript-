<input type="text" id="roll" placeholder="Roll Number">

<input type="text" id="course" placeholder="Course">

<div class="card">

<label>JavaScript Lab</label>

<input type="number" id="js">

<input type="number" id="cn">

<label>Compiler Construction</label>

<input type="number" id="cc">

<label>Data Compression</label>

<input type="number" id="dc">

<label>Agentic AI</label>

<input type="number" id="ai">

</div>

</div>

<div class="button-box">

<button onclick="calculateResult()">

Calculate Result

</button>

<button onclick="resetForm()">

🔄 Reset

</button>

</div>
<section class="stats">

<div class="stat-card">

<h3>📚</h3>

</div>

<div class="stat-card">

<h3>🏆</h3>
