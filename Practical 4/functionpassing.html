<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Expression</title>
</head>

<body>

    <h2>JavaScript Function Expression</h2>

    <script>

        const greet = function () {
            return "Hello from Function Expression";
        };

        alert(greet());

    </script>

</body>
</html>
